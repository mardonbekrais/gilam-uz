<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dastavchik | Gilam Zakaz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .counter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .counter-btn {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        .counter-btn:active {
            transform: scale(0.95);
            border-color: var(--primary);
        }
        .counter-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .counter-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--gray);
            margin-bottom: 5px;
        }
        .counter-value {
            display: block;
            font-size: 20px;
            font-weight: 800;
            color: var(--dark);
        }
        .counter-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .sqm-item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .sqm-item-row input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Yuklanmoqda...</p>
    </div>

    <div class="main-content">
        <!-- HOME PAGE -->
        <div id="homePage" class="page active">
            <div class="mobile-header">
                <div class="welcome-section">
                    <h1>Dastavchik</h1>
                    <div class="date" id="currentDate">...</div>
                </div>
                <button class="admin-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>

            <div class="stats-cards">
                <div class="stat-card">
                    <i class="fas fa-clock" style="color: var(--warning);"></i>
                    <div class="stat-value" id="stat-kutilmoqda">0</div>
                    <div class="stat-label">Kutilmoqda</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-double" style="color: var(--success);"></i>
                    <div class="stat-value" id="stat-tayyor">0</div>
                    <div class="stat-label">Tayyor</div>
                </div>
            </div>

            <div class="filter-chips">
                <button class="chip active" onclick="setFilter(this, 'new')">Kutilmoqda</button>
                <button class="chip" onclick="setFilter(this, 'ready')">Tayyor</button>
                <button class="chip" onclick="setFilter(this, 'done')">Yetkazildi</button>
                <button class="chip" onclick="setFilter(this, 'all')">Hammasi</button>
            </div>

            <div id="ordersList" class="orders-list"></div>
        </div>

        <!-- REFINE PAGE -->
        <div id="refinePage" class="page">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                <button class="admin-btn" onclick="switchPage('home')" style="width:40px;height:40px;font-size:16px;"><i class="fas fa-arrow-left"></i></button>
                <h1 style="margin:0; font-size:24px;">Buyurtmani sozlash</h1>
            </div>

            <div id="refine-header" class="det-header-card" style="margin-bottom:20px;"></div>

            <div class="form-group">
                <label><i class="fas fa-location-dot"></i> GPS Lokatsiya</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="refine-gps" readonly placeholder="Hali olinmadi">
                    <button class="btn-save" style="width:auto; padding:0 20px; white-space:nowrap;" onclick="getGPS()">
                        <i class="fas fa-location-crosshairs"></i> GPS olish
                    </button>
                </div>
            </div>

            <div class="section-header">
                <h2>📦 Mahsulotlar ro'yxati</h2>
                <button class="see-all" onclick="openAddProduct()">+ Mahsulot qo'shish</button>
            </div>
            <div id="productList"></div>

            <div class="live-calculator" style="margin-top:20px; border: 2px solid var(--primary-light);">
                <div class="calc-item"><span>Jami mahsulot:</span> <strong id="total-count">0 ta</strong></div>
                <div class="calc-item"><span>Jami kvartrat/kg:</span> <strong id="total-area">0</strong></div>
                <div class="calc-item total"><span>Jami summa:</span> <strong id="total-price">0 so'm</strong></div>
            </div>

            <button class="btn-save" onclick="saveRefinedOrder()" style="margin-top:24px; height: 60px; font-size: 18px;">
                <i class="fas fa-save"></i> SAQLASH VA YUVISHGA TAYYORLASH
            </button>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Mahsulot qo'shish</h2>
                <button class="close-btn" onclick="closeProductModal()">✕</button>
            </div>
            <div class="modal-body">
                <div id="catalogSection">
                    <p style="font-size:13px; color:var(--gray); margin-bottom:15px;">Katalogdan tanlang:</p>
                    <div id="dynamic-product-buttons" class="quick-actions" style="grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom:20px;">
                        <!-- Dynamic buttons from catalog -->
                    </div>
                    <div style="margin-top:10px; padding-top:20px; border-top:1px solid var(--border);">
                        <label style="font-weight:700; margin-bottom:10px; display:block;">Boshqa (Katalogda yo'q):</label>
                        <input type="text" id="other-name" placeholder="Masalan: Yakandoz" style="width:100%; padding:14px; border:2px solid var(--border); border-radius:12px; margin-bottom:15px;">
                        <button class="btn-save" style="width:100%;" onclick="addOtherProduct()">
                            <i class="fas fa-plus"></i> Yangi mahsulot sifatida qo'shish
                        </button>
                    </div>
                </div>

                <div id="refineSection" style="display:none;">
                    <div id="selectedProductHeader" style="text-align:center; margin-bottom:20px;">
                        <span id="sel-emoji" style="font-size:40px; display:block; margin-bottom:5px;"></span>
                        <h3 id="sel-name" style="margin:0;"></h3>
                    </div>

                    <div class="counter-grid">
                        <div id="btn-s" class="counter-btn" onclick="increment('s')">
                            <span class="counter-label">KICHIK (S)</span>
                            <span class="counter-value" id="val-s">0</span>
                            <div class="counter-badge" id="badge-s" style="display:none;">0</div>
                        </div>
                        <div id="btn-m" class="counter-btn" onclick="increment('m')">
                            <span class="counter-label">O'RTACHA (M)</span>
                            <span class="counter-value" id="val-m">0</span>
                            <div class="counter-badge" id="badge-m" style="display:none;">0</div>
                        </div>
                        <div id="btn-l" class="counter-btn" onclick="increment('l')">
                            <span class="counter-label">KATTA (L)</span>
                            <span class="counter-value" id="val-l">0</span>
                            <div class="counter-badge" id="badge-l" style="display:none;">0</div>
                        </div>
                        <div id="btn-kg" class="counter-btn" onclick="increment('kg')">
                            <span class="counter-label">KILOGRAMM (KG)</span>
                            <span class="counter-value" id="val-kg">0</span>
                            <div class="counter-badge" id="badge-kg" style="display:none;">0</div>
                        </div>
                    </div>

                    <div id="sqmInputArea" style="display:none; background:var(--bg); padding:15px; border-radius:15px; margin-bottom:20px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <h3 style="font-size:14px; margin:0;"><i class="fas fa-ruler-combined"></i> Kvadrat metr (m²)</h3>
                            <button class="btn-action" style="background:var(--primary); color:white; width:30px; height:30px; border-radius:50%;" onclick="addSqmRow()">+</button>
                        </div>
                        <div id="sqmRows"></div>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button class="btn-save" style="background:var(--gray); flex:1;" onclick="backToCatalog()">Orqaga</button>
                        <button class="btn-save" style="flex:2;" onclick="confirmProductAdd()">Tayyor</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DETAILS MODAL -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-info-circle"></i> Tafsilotlar</h2>
                <button class="close-btn" onclick="closeDetailsModal()">✕</button>
            </div>
            <div class="modal-body" id="detailsContent"></div>
            <div id="detailsNavigation"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/common.js"></script>
    <script src="js/delivery.js"></script>
</body>
</html>
