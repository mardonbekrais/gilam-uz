<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dastavchik | Gilam Zakaz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .product-item-row {
            display: grid; grid-template-columns: 40px 1fr 60px 70px 80px 30px; align-items: center; gap: 8px; margin-bottom: 12px;
            padding: 12px; background: var(--white); border-radius: 16px; border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .p-input-group { display: flex; flex-direction: column; gap: 4px; }
        .p-input-group label { font-size: 10px; color: var(--gray); font-weight: 700; text-transform: uppercase; }
        .p-input-group input { 
            padding: 8px; border: 2px solid var(--border); border-radius: 8px; width: 100%; 
            font-size: 14px; font-weight: 600; text-align: center;
        }
        .p-input-group input:focus { border-color: var(--primary); outline: none; }
        .p-name { font-weight: 700; font-size: 14px; color: var(--dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .det-nav-route { background: #4285F4; color: white; flex: 1.5 !important; }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Yuklanmoqda...</p>
    </div>

    <div class="main-content">
        <!-- HOME PAGE -->
        <div id="homePage" class="page active">
            <div class="mobile-header">
                <div class="welcome-section">
                    <h1>Dastavchik</h1>
                    <div class="date" id="currentDate">...</div>
                </div>
                <button class="admin-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>

            <div class="stats-cards">
                <div class="stat-card">
                    <i class="fas fa-clock" style="color: var(--warning);"></i>
                    <div class="stat-value" id="stat-kutilmoqda">0</div>
                    <div class="stat-label">Kutilmoqda</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-soap" style="color: var(--info);"></i>
                    <div class="stat-value" id="stat-yuvilmoqda">0</div>
                    <div class="stat-label">Yuvilmoqda</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-double" style="color: var(--success);"></i>
                    <div class="stat-value" id="stat-tayyor">0</div>
                    <div class="stat-label">Tayyor</div>
                </div>
            </div>

            <div class="filter-chips">
                <button class="chip" onclick="setFilter(this, 'new')">Kutilmoqda</button>
                <button class="chip" onclick="setFilter(this, 'washing')">Yuvilmoqda</button>
                <button class="chip" onclick="setFilter(this, 'ready')">Tayyor</button>
                <button class="chip active" onclick="setFilter(this, 'all')">Yetgazildi</button>
            </div>

            <div id="ordersList" class="orders-list"></div>
        </div>

        <!-- REFINE PAGE -->
        <div id="refinePage" class="page">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                <button class="admin-btn" onclick="switchPage('home')" style="width:40px;height:40px;font-size:16px;"><i class="fas fa-arrow-left"></i></button>
                <h1 style="margin:0; font-size:24px;">Buyurtmani sozlash</h1>
            </div>

            <div id="refine-header" class="det-header-card" style="margin-bottom:20px;"></div>

            <div class="form-group">
                <label><i class="fas fa-location-dot"></i> GPS Lokatsiya</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="refine-gps" readonly placeholder="Hali olinmadi">
                    <button class="btn-save" style="width:auto; padding:0 20px; white-space:nowrap;" onclick="getGPS()">
                        <i class="fas fa-location-crosshairs"></i> GPS olish
                    </button>
                </div>
            </div>

            <div class="section-header">
                <h2>📦 Mahsulotlar ro'yxati</h2>
                <button class="see-all" onclick="openAddProduct()">+ Mahsulot qo'shish</button>
            </div>
            <div id="productList"></div>

            <div class="live-calculator" style="margin-top:20px; border: 2px solid var(--primary-light);">
                <div class="calc-item"><span>Jami mahsulot:</span> <strong id="total-count">0 ta</strong></div>
                <div class="calc-item"><span>Jami kvartrat:</span> <strong id="total-area">0 m²</strong></div>
                <div class="calc-item total"><span>Jami summa:</span> <strong id="total-price">0 so'm</strong></div>
            </div>

            <button class="btn-save" onclick="saveRefinedOrder()" style="margin-top:24px; height: 60px; font-size: 18px;">
                <i class="fas fa-save"></i> SAQLASH VA YUVISHGA YUBORISH
            </button>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Mahsulot qo'shish</h2>
                <button class="close-btn" onclick="closeModal('productModal')">✕</button>
            </div>
            <div class="modal-body">
                <p style="font-size:13px; color:var(--gray); margin-bottom:15px;">Katalogdan tanlang:</p>
                <div id="dynamic-product-buttons" class="quick-actions" style="grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom:20px;">
                    <!-- Dynamic buttons from catalog -->
                </div>
                <div style="margin-top:10px; padding-top:20px; border-top:1px solid var(--border);">
                    <label style="font-weight:700; margin-bottom:10px; display:block;">Boshqa (Katalogda yo'q):</label>
                    <input type="text" id="other-name" placeholder="Masalan: Yakandoz" style="width:100%; padding:14px; border:2px solid var(--border); border-radius:12px; margin-bottom:15px;">
                    <button class="btn-save" style="width:100%;" onclick="addOtherProduct()">
                        <i class="fas fa-plus"></i> Qo'shish
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- DETAILS MODAL -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-info-circle"></i> Tafsilotlar</h2>
                <button class="close-btn" onclick="closeDetailsModal()">✕</button>
            </div>
            <div class="modal-body" id="detailsContent"></div>
            <div id="detailsNavigation"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/common.js"></script>
    <script src="js/delivery.js"></script>
</body>
</html>
