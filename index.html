<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gilam Zakaz | Kirish</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        .entry-container {
            background: var(--white);
            padding: 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }
        .logo-icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
        }
        h1 { margin-bottom: 10px; font-weight: 800; color: var(--dark); }
        p { color: var(--gray); margin-bottom: 30px; }
        .role-buttons {
            display: grid;
            gap: 15px;
        }
        .role-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 20px;
            text-decoration: none;
            color: var(--dark);
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .role-btn i { font-size: 24px; color: var(--primary); width: 30px; }
        .role-btn:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <div class="entry-container">
        <span class="logo-icon">🧺</span>
        <h1>Gilam Zakaz</h1>
        <p>Loyiha boshqaruv tizimi. Davom etish uchun rolingizni tanlang:</p>
        
        <div class="role-buttons">
            <a href="dispatcher.html" class="role-btn">
                <i class="fas fa-headset"></i>
                <span>Dispetcher</span>
            </a>
            <a href="delivery.html" class="role-btn">
                <i class="fas fa-truck"></i>
                <span>Dastavchik</span>
            </a>
            <a href="admin.html" class="role-btn">
                <i class="fas fa-user-shield"></i>
                <span>Admin Panel</span>
            </a>
        </div>
    </div>
</body>
</html>
